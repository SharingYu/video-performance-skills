name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VIDEO_OBSERVE_REQUIRE_MEDIA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/video-observation/scripts/requirements.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests
